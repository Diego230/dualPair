name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** paste Bluetooth keys or Wi-Fi passwords. `dualpair-cli` output hides keys unless you add `--show-keys`.
  - type: input
    id: version
    attributes:
      label: DualPair version
      placeholder: "0.4.1"
    validations:
      required: true
  - type: input
    id: systems
    attributes:
      label: Systems
      placeholder: "Ubuntu 24.04 + Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead. Screenshots welcome.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: |
        Linux: `sudo dualpair-cli scan`. Windows: the error shown in the window, or `DualPair.exe --status --json` from an administrator terminal.
      render: text
