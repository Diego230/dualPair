name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]   # a release created on GitHub (or via the API) gets the .deb and the installer attached

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 22.04 = oldest supported target (Python 3.10, libadwaita 1.1)
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (system Python)
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -m unittest discover -s tests -t . -v

      - name: Build .deb
        run: packaging/build-deb.sh

      - name: Install the .deb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./dist/dualpair_*_all.deb

      - name: Smoke test the installed package
        run: |
          mkdir -p /tmp/bt/C4:13:75:C0:E2:E6
          sudo dualpair-cli --win tests/fixtures/SYSTEM --bluez-dir /tmp/bt --state-dir /tmp/state scan
          sudo dualpair-cli --win tests/fixtures/SYSTEM --bluez-dir /tmp/bt --state-dir /tmp/state sync --all
          sudo dualpair-cli --win tests/fixtures/SYSTEM --bluez-dir /tmp/bt --state-dir /tmp/state --json scan \
            | python3 -c "import json,sys; d=json.load(sys.stdin); s={x['status'] for x in d['devices']}; print(s); assert s=={'in_sync'}"
          # started through pkexec, the helpers must refuse custom paths, key printing and (read helper) writes
          sudo env PKEXEC_UID=1000 /usr/lib/dualpair/dualpair-helper --json --bluez-dir /tmp/bt scan | grep -q option_not_allowed
          sudo env PKEXEC_UID=1000 /usr/lib/dualpair/dualpair-helper --json sync --all --dry-run --show-keys | grep -q option_not_allowed
          sudo /usr/lib/dualpair/dualpair-helper-read --json --win tests/fixtures/SYSTEM --bluez-dir /tmp/bt sync --all | grep -q read_only
          sudo dualpair-cli --win tests/fixtures/SYSTEM --bluez-dir /tmp/bt --state-dir /tmp/state sync --all --dry-run \
            | grep '^Key=' | grep -vqx 'Key=<hidden>' && { echo "keys printed"; exit 1; } || true
          echo "helper restrictions ok"
          # the window module must import with the distro's GTK4/libadwaita
          /usr/bin/python3 -c "import sys; sys.path.insert(0, '/usr/lib/dualpair'); import dualpair.gui; print('gui import ok')"
          desktop-file-validate /usr/share/applications/io.github.dualpair.DualPair.desktop || true

      - name: Upload .deb
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: dualpair-deb
          path: dist/*.deb


  windows:
    name: DualPair for Windows (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the app and the tests (.NET Framework 4.8)
        run: |
          dotnet build windows/app/DualPair.csproj -c Release -nologo
          dotnet build windows/tests/Tests.csproj -c Release -nologo

      - name: Tests, and cross-check with the Linux (Python) side
        shell: pwsh
        run: |
          $box = Join-Path $env:RUNNER_TEMP 'cross'
          python tests/cross_check.py make $box
          $out = & windows/tests/bin/Release/net48/DualPair.Tests.exe tests/protocol_vectors.json (Join-Path $box 'EFI\DualPair')
          $out
          if ($LASTEXITCODE -ne 0) { throw "C# tests failed" }
          $export = ($out | Select-String '^export for Python: (.*)$').Matches[0].Groups[1].Value
          python tests/cross_check.py check $export
          if ($LASTEXITCODE -ne 0) { throw "cross-check failed" }

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows/installer/DualPair.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist

      - name: Install, run the SYSTEM task, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/DualPair-Setup-*.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $exe = Join-Path $env:ProgramFiles 'DualPair\DualPair.exe'
          if (-not (Test-Path $exe)) { throw "not installed" }
          schtasks /Query /TN "DualPair\Agent" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "task missing" }
          $state = Join-Path $env:ProgramData 'DualPair'
          Remove-Item (Join-Path $state 'status.json') -ErrorAction SilentlyContinue
          # the window's path: a request answered by the SYSTEM task
          "status (read only): " + (& $exe --status --json)
          $r = & $exe --run status --json | ConvertFrom-Json
          "answer: $($r | ConvertTo-Json -Compress -Depth 5)"
          if ($r.result.error) { throw "agent did not answer: $($r.result.error)" }
          $st = Get-Content (Join-Path $state 'status.json') -Raw | ConvertFrom-Json
          "status written by SYSTEM: esp=$($st.esp) devices=$($st.bluetooth.devices.Count) rtc_utc=$($st.clock.rtc_utc)"
          $acl = (Get-Acl $state).Access | ForEach-Object { "$($_.IdentityReference): $($_.FileSystemRights)" }
          $acl
          if ($acl -match 'Users: .*(Write|Modify|FullControl)') { throw "users can write the state folder" }
          $uninst = Join-Path $env:ProgramFiles 'DualPair\unins000.exe'
          Start-Process $uninst -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 3
          schtasks /Query /TN "DualPair\Agent" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "task still there after uninstall" }
          if (Test-Path $state) { throw "state folder still there after uninstall" }
          $global:LASTEXITCODE = 0
          "install / task / uninstall ok"

      - name: Screenshots of the window (test data)
        continue-on-error: true
        shell: pwsh
        run: |
          $root = 'HKLM:\SOFTWARE\DualPairTest'
          $keys = "$root\BTHPORT\Parameters\Keys\c41375c0e2e6"
          New-Item -Path "$keys\fcc2073c8ad2" -Force | Out-Null
          New-ItemProperty -Path $keys -Name 'a4bfc6d0e5ff' -PropertyType Binary -Value ([byte[]](1..16)) -Force | Out-Null
          New-ItemProperty -Path $keys -Name '001b66b69ecf' -PropertyType Binary -Value ([byte[]](21..36)) -Force | Out-Null
          New-ItemProperty -Path "$keys\fcc2073c8ad2" -Name 'LTK' -PropertyType Binary -Value ([byte[]](41..56)) -Force | Out-Null
          New-ItemProperty -Path "$keys\fcc2073c8ad2" -Name 'EDIV' -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path "$keys\fcc2073c8ad2" -Name 'ERand' -PropertyType QWord -Value 2 -Force | Out-Null
          foreach ($d in @(@('a4bfc6d0e5ff','WH-1000XM4'), @('001b66b69ecf','JBL Go 3'), @('fcc2073c8ad2','TK-MS317 5.0'))) {
            New-Item -Path "$root\BTHPORT\Parameters\Devices\$($d[0])" -Force | Out-Null
            New-ItemProperty -Path "$root\BTHPORT\Parameters\Devices\$($d[0])" -Name Name -PropertyType Binary -Value ([Text.Encoding]::UTF8.GetBytes($d[1] + [char]0)) -Force | Out-Null
          }
          New-Item -Path "$root\TZ" -Force | Out-Null
          $box = Join-Path $env:RUNNER_TEMP 'shotbox'
          python tests/cross_check.py make $box
          $mb = Join-Path $box 'EFI\DualPair'
          $fp = python -c "from dualpair.mailbox import fingerprint; print(fingerprint('0102030405060708090A0B0C0D0E0F10',None,None,None))"
          $now = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          @{dualpair=1; system='linux'; version='0.3.0'; written=$now; clock=@{rtc_utc=$true; timezone='Europe/Rome'};
            bluetooth=@{available=$true; devices=@(@{adapter='C4:13:75:C0:E2:E6'; address='A4:BF:C6:D0:E5:FF'; kind='classic'; fingerprint=$fp})}} |
            ConvertTo-Json -Depth 6 | Set-Content (Join-Path $mb 'status-linux.json') -Encoding utf8NoBOM
          $env:DUALPAIR_INPROC = '1'
          $exe = (Resolve-Path windows/app/bin/Release/net48/DualPair.exe).Path
          $p = Start-Process $exe -PassThru -ArgumentList '--mailbox-dir', "`"$mb`"", '--registry-params', 'SOFTWARE\DualPairTest\BTHPORT\Parameters', '--state-dir', "`"$env:RUNNER_TEMP\shotstate`"", '--clock-key', 'SOFTWARE\DualPairTest\TZ'
          Start-Sleep -Seconds 10
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class W { [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Ri, B; } [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r); }'
          function Shot($name) {
            $p.Refresh()
            $r = New-Object W+R
            [W]::GetWindowRect($p.MainWindowHandle, [ref]$r) | Out-Null
            $w = [Math]::Max(200, $r.Ri - $r.L); $h = [Math]::Max(200, $r.B - $r.T)
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.L, $r.T, 0, 0, (New-Object System.Drawing.Size $w, $h))
            New-Item -ItemType Directory -Force screenshots | Out-Null
            $bmp.Save("screenshots/$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            # also in the log, so it can be read without downloading artifacts
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("screenshots/$name.png"))
            "SHOT-BEGIN $name"
            for ($i = 0; $i -lt $b64.Length; $i += 4000) { "SHOT " + $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i)) }
            "SHOT-END $name"
          }
          $ws = New-Object -ComObject WScript.Shell
          $ws.AppActivate($p.Id) | Out-Null
          Start-Sleep -Seconds 1
          Shot 'windows-bluetooth'
          foreach ($name in 'windows-wifi', 'windows-clock', 'windows-boot') {
            $ws.SendKeys('^{TAB}')
            Start-Sleep -Seconds 2
            Shot $name
          }
          Stop-Process $p -Force
          Remove-Item $root -Recurse -Force

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: screenshots/*.png

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: dualpair-windows
          path: dist/DualPair-Setup-*.exe

  release:
    name: Release
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dualpair-deb
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: dualpair-windows
          path: dist
      - name: Attach the .deb and the Windows installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.deb dist/*.exe --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/*.deb dist/*.exe --repo "$GITHUB_REPOSITORY" --title "DualPair $TAG" --generate-notes
          fi
