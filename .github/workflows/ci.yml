name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 22.04 = oldest supported target (Python 3.10, libadwaita 1.1)
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (system Python)
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -m unittest discover -s tests -t . -v

      - name: Build .deb
        run: packaging/build-deb.sh

      - name: Install the .deb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./dist/dualpair_*_all.deb

      - name: Smoke test the installed package
        run: |
          mkdir -p /tmp/bt/C4:13:75:C0:E2:E6
          sudo dualpair-cli --win tests/fixtures/SYSTEM --bluez-dir /tmp/bt --state-dir /tmp/state scan
          sudo dualpair-cli --win tests/fixtures/SYSTEM --bluez-dir /tmp/bt --state-dir /tmp/state sync --all
          sudo dualpair-cli --win tests/fixtures/SYSTEM --bluez-dir /tmp/bt --state-dir /tmp/state --json scan \
            | python3 -c "import json,sys; d=json.load(sys.stdin); s={x['status'] for x in d['devices']}; print(s); assert s=={'in_sync'}"
          # started through pkexec, the helpers must refuse custom paths, key printing and (read helper) writes
          sudo env PKEXEC_UID=1000 /usr/lib/dualpair/dualpair-helper --json --bluez-dir /tmp/bt scan | grep -q option_not_allowed
          sudo env PKEXEC_UID=1000 /usr/lib/dualpair/dualpair-helper --json sync --all --dry-run --show-keys | grep -q option_not_allowed
          sudo /usr/lib/dualpair/dualpair-helper-read --json --win tests/fixtures/SYSTEM --bluez-dir /tmp/bt sync --all | grep -q read_only
          sudo dualpair-cli --win tests/fixtures/SYSTEM --bluez-dir /tmp/bt --state-dir /tmp/state sync --all --dry-run \
            | grep '^Key=' | grep -vqx 'Key=<hidden>' && { echo "keys printed"; exit 1; } || true
          echo "helper restrictions ok"
          # the window module must import with the distro's GTK4/libadwaita
          /usr/bin/python3 -c "import sys; sys.path.insert(0, '/usr/lib/dualpair'); import dualpair.gui; print('gui import ok')"
          desktop-file-validate /usr/share/applications/io.github.dualpair.DualPair.desktop || true

      - name: Build Windows zip
        if: matrix.os == 'ubuntu-24.04'
        run: |
          packaging/build-windows-zip.sh
          pwsh -NoProfile -Command '$e=$null; [System.Management.Automation.Language.Parser]::ParseFile("windows/DualPair.ps1",[ref]$null,[ref]$e) | Out-Null; if ($e) { $e; exit 1 } else { "PowerShell parse ok" }'

      - name: Upload .deb
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: dualpair-deb
          path: dist/*.deb

      - name: Upload Windows zip
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: dualpair-windows
          path: dist/dualpair-windows-*.zip

  windows:
    name: Windows tool (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1, what users have
    steps:
      - uses: actions/checkout@v4
      - name: Status, Use UTC, back to local time
        run: |
          $ps = 'windows\DualPair.ps1'
          function Run([string[]]$a) {
            $out = powershell -NoProfile -ExecutionPolicy Bypass -File $ps @a
            if ($LASTEXITCODE -ne 0) { throw "exit $LASTEXITCODE" }
            return $out
          }
          $s = Run @('-Status', '-Json') | ConvertFrom-Json
          "initial: $($s | ConvertTo-Json -Compress)"
          $s = Run @('-SetUtc', '-Json') | ConvertFrom-Json
          if (-not $s.rtc_utc) { throw 'SetUtc did not apply' }
          $v = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\TimeZoneInformation').RealTimeIsUniversal
          if ($v -ne 1) { throw "registry value is $v" }
          $s = Run @('-SetLocal', '-Json') | ConvertFrom-Json
          if ($s.rtc_utc) { throw 'SetLocal did not apply' }
          $s = Run @('-Status')
          "text status: $s"
          "Windows tool ok"

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dualpair-deb
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: dualpair-windows
          path: dist
      - name: Create GitHub release with the .deb and the Windows zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.deb dist/*.zip --repo "${GITHUB_REPOSITORY}" --title "DualPair ${GITHUB_REF_NAME}" --generate-notes
